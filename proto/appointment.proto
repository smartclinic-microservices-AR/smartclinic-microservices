syntax = "proto3";

package appointment;

message Appointment {
  string id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  string date = 4;
  string reason = 5;
  string status = 6;
  string created_at = 7;
}

message CreateAppointmentRequest {
  string patient_id = 1;
  string doctor_id = 2;
  string date = 3;
  string reason = 4;
}

message GetAppointmentRequest {
  string id = 1;
}

message ListAppointmentsRequest {}

message ListAppointmentsResponse {
  repeated Appointment appointments = 1;
}

message UpdateAppointmentStatusRequest {
  string id = 1;
  string status = 2;
}

message DeleteAppointmentRequest {
  string id = 1;
}

message DeleteAppointmentResponse {
  bool success = 1;
  string message = 2;
}

message ListAppointmentsByPatientRequest {
  string patient_id = 1;
}

message ListAppointmentsByDoctorRequest {
  string doctor_id = 1;
}

service AppointmentService {
  rpc CreateAppointment(CreateAppointmentRequest) returns (Appointment);
  rpc GetAppointment(GetAppointmentRequest) returns (Appointment);
  rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse);
  rpc UpdateAppointmentStatus(UpdateAppointmentStatusRequest) returns (Appointment);
  rpc DeleteAppointment(DeleteAppointmentRequest) returns (DeleteAppointmentResponse);
  rpc ListAppointmentsByPatient(ListAppointmentsByPatientRequest) returns (ListAppointmentsResponse);
  rpc ListAppointmentsByDoctor(ListAppointmentsByDoctorRequest) returns (ListAppointmentsResponse);
}
syntax = "proto3";

package doctor;

message Doctor {
  string id = 1;
  string full_name = 2;
  string specialty = 3;
  string email = 4;
  string phone = 5;
  string created_at = 6;
}

message CreateDoctorRequest {
  string full_name = 1;
  string specialty = 2;
  string email = 3;
  string phone = 4;
}

message GetDoctorRequest {
  string id = 1;
}

message ListDoctorsRequest {}

message ListDoctorsResponse {
  repeated Doctor doctors = 1;
}

message UpdateDoctorRequest {
  string id = 1;
  string full_name = 2;
  string specialty = 3;
  string email = 4;
  string phone = 5;
}

message DeleteDoctorRequest {
  string id = 1;
}

message DeleteDoctorResponse {
  bool success = 1;
  string message = 2;
}

message SearchDoctorsBySpecialtyRequest {
  string specialty = 1;
}

message CheckDoctorAvailabilityRequest {
  string doctor_id = 1;
  string date = 2;
}

message CheckDoctorAvailabilityResponse {
  bool available = 1;
  string message = 2;
}

service DoctorService {
  rpc CreateDoctor(CreateDoctorRequest) returns (Doctor);
  rpc GetDoctor(GetDoctorRequest) returns (Doctor);
  rpc ListDoctors(ListDoctorsRequest) returns (ListDoctorsResponse);
  rpc UpdateDoctor(UpdateDoctorRequest) returns (Doctor);
  rpc DeleteDoctor(DeleteDoctorRequest) returns (DeleteDoctorResponse);
  rpc SearchDoctorsBySpecialty(SearchDoctorsBySpecialtyRequest) returns (ListDoctorsResponse);
  rpc CheckDoctorAvailability(CheckDoctorAvailabilityRequest) returns (CheckDoctorAvailabilityResponse);
}